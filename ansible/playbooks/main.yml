---
# main.yml — Master playbook
#
# Always use make targets — they include the correct dependency tag chain.
# Running --tags directly skips dependency role tasks (common, brew).
#
# Usage:
#   make install PROFILE=work          # full setup
#   make zsh     PROFILE=work          # zsh only  (runs: common,brew,zsh)
#   make lazyvim PROFILE=work          # neovim    (runs: common,brew,lazyvim)
#   make dotfiles PROFILE=work         # dotfiles  (runs: common,brew,zsh,dotfiles)
#   make brew    PROFILE=work          # brew only (runs: common,brew)
#   make tools   PROFILE=work          # CLI tools (runs: common,brew,tools)
#   make gnome_terminal PROFILE=work   # terminal  (runs: common,brew,gnome_terminal)
#
# Available tags: common, brew, zsh, lazyvim, dotfiles, tools, gnome_terminal, work, private

- name: Bootstrap machine
  hosts: localhost
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/all.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/{{ profile | default('work') }}.yml"

  pre_tasks:
    - name: Validate profile variable
      ansible.builtin.assert:
        that:
          - profile is defined
          - profile in ['work', 'private']
        fail_msg: "profile must be 'work' or 'private'. Pass with: -e profile=work"
      tags: [always]

  roles:
    - role: common
      tags: [common]

    - role: brew
      tags: [brew]

    - role: lazyvim
      tags: [lazyvim]

    - role: zsh
      tags: [zsh]

    - role: work
      tags: [work]
      when: profile == 'work'

    - role: private
      tags: [private]
      when: profile == 'private'

    - role: gnome_terminal
      tags: [gnome_terminal]

    - role: tools
      tags: [tools]

    - role: dotfiles
      tags: [dotfiles]
