---
# roles/brew/tasks/main.yml
# Installs Linuxbrew and required brew packages / casks.
# ALL tasks must run as regular user (become: false) — brew refuses to run as root.

- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: "{{ brew_bin }}"
  register: brew_stat
  become: false
  tags: brew

- name: Create /home/linuxbrew directory
  ansible.builtin.file:
    path: /home/linuxbrew
    state: directory
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
    mode: "0755"
  become: true
  when: not brew_stat.stat.exists
  tags: brew

- name: Install Homebrew (Linuxbrew)
  ansible.builtin.shell: |
    NONINTERACTIVE=1 /bin/bash -c \
      "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  become: false
  when: not brew_stat.stat.exists
  changed_when: false
  tags: brew

- name: Ensure brew shellenv in ~/.profile
  ansible.builtin.blockinfile:
    path: "{{ lookup('env', 'HOME') }}/.profile"
    marker: "# {mark} ANSIBLE MANAGED — Homebrew"
    block: |
      eval "$({{ brew_prefix }}/bin/brew shellenv)"
    create: true
    mode: "0644"
  become: false
  tags: brew
