---
# roles/work/tasks/main.yml — Company-specific setup
# Add tasks for: corp CA certs, proxy config, VPN, internal tools, etc.

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
  become: true
  tags: work

