---
# roles/work/tasks/main.yml — Company-specific setup
# Depends on: common (declared in meta/main.yml)

- name: Install work apt packages
  ansible.builtin.apt:
    name: "{{ work_apt_packages + (profile_packages | default([])) }}"
    state: present
  become: true
  tags: work

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
  become: true
  tags: work

