---
# Theme to activate in ~/.zshrc
zsh_theme: powerline

# oh-my-zsh paths
zsh_home: "{{ lookup('env', 'HOME') }}/.oh-my-zsh"
zsh_plugins: "{{ zsh_home }}/custom/plugins"

# Apt packages this role needs
zsh_apt_packages:
  - zsh
  - fonts-powerline

# oh-my-zsh plugins to clone — add/remove here without touching tasks
zsh_plugin_list:
  - repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: "{{ zsh_plugins }}/zsh-autosuggestions"
  - repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: "{{ zsh_plugins }}/zsh-syntax-highlighting"

# Common dotfile symlinks — src relative to dotfiles_dir
zsh_symlinks:
  - src: "{{ dotfiles_dir }}/zsh/aliases.zsh"
    dest: "{{ zsh_home }}/custom/aliases.zsh"
