---
# roles/zsh/tasks/main.yml
# Installs oh-my-zsh + plugins, sets up prompt/theme and symlinks zsh config.
# Depends on: common (declared in meta/main.yml) — provides git.

- name: Install zsh apt packages
  ansible.builtin.apt:
    name: "{{ zsh_apt_packages }}"
    state: present
  become: true
  tags: zsh

- name: Clone oh-my-zsh
  ansible.builtin.git: # noqa: latest[git]
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ zsh_home }}"
    depth: 1
  become: false
  tags: zsh

- name: Install oh-my-zsh plugins
  ansible.builtin.git: # noqa: latest[git]
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    depth: 1
  loop: "{{ zsh_plugin_list }}"
  become: false
  tags: zsh

- name: Ensure oh-my-zsh custom themes dir
  ansible.builtin.file:
    path: "{{ zsh_home }}/custom/themes"
    state: directory
    mode: "0755"
  become: false
  tags: zsh

- name: Symlink powerline theme into oh-my-zsh
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/zsh/theme-powerline.zsh-theme"
    dest: "{{ zsh_home }}/custom/themes/powerline.zsh-theme"
    state: link
    force: true
  become: false
  tags: zsh

- name: Symlink zsh dotfiles into oh-my-zsh custom
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ zsh_symlinks }}"
  become: false
  tags: zsh

- name: Symlink work-specific zsh aliases into oh-my-zsh custom
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/work/zsh/aliases-work.zsh"
    dest: "{{ zsh_home }}/custom/aliases-work.zsh"
    state: link
    force: true
  become: false
  tags: zsh
  when: profile == 'work'

- name: Symlink profile-specific ~/.zshenv
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/{{ profile }}/zsh/zshenv"
    dest: "{{ lookup('env', 'HOME') }}/.zshenv"
    state: link
    force: true
  become: false
  tags: zsh
  when: profile in ['work', 'private']

- name: Set ZSH_THEME to powerline in ~/.zshrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    regexp: "^ZSH_THEME="
    line: 'ZSH_THEME="{{ zsh_theme }}"'
    create: false
  become: false
  tags: zsh

- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
  become: true
  tags: zsh
