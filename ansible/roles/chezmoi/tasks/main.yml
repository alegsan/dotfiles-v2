---
# roles/chezmoi/tasks/main.yml
# Installs chezmoi binary and applies dotfiles from the embedded home/ source dir.

- name: Check if chezmoi is installed
  ansible.builtin.command: which chezmoi
  register: chezmoi_which
  failed_when: false
  changed_when: false
  tags: dotfiles

- name: Install chezmoi via official install script
  ansible.builtin.shell: |
    sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "{{ neovim_bin_dir }}"
  args:
    creates: "{{ neovim_bin_dir }}/chezmoi"
  when: chezmoi_which.rc != 0
  tags: dotfiles

- name: Ensure chezmoi config directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/chezmoi"
    state: directory
    mode: "0700"
  become: false
  tags: dotfiles

- name: Pre-populate chezmoi config (skips interactive prompts during init)
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.config/chezmoi/chezmoi.toml"
    content: |
      [data]
          profile = "{{ profile }}"
          name    = "{{ chezmoi_name | default('Your Name') }}"
          email   = "{{ chezmoi_email | default('your@email.com') }}"
    mode: "0600"
    force: false
  become: false
  tags: dotfiles

- name: Run chezmoi apply from local source directory
  ansible.builtin.command: >
    {{ neovim_bin_dir }}/chezmoi apply
    --source {{ chezmoi_source_dir }}
  register: chezmoi_apply
  changed_when: chezmoi_apply.stdout != ""
  become: false
  tags: dotfiles
