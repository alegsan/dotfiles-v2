---
# roles/private/tasks/main.yml — Personal machine setup
# Depends on: common (listed before this role in playbook)

- name: Install private apt packages
  ansible.builtin.apt:
    name: "{{ private_apt_packages + (profile_packages | default([])) }}"
    state: present
  become: true
  tags: private

- name: Private role placeholder
  ansible.builtin.debug:
    msg: "Private profile active — add your personal tasks here."
  tags: private
