---
# True base packages — needed on every machine regardless of profile.
# Everything else belongs in the role that actually uses it.
common_packages:
  - make
  - git
  - curl
  - wget
  - build-essential
  - unzip
  - jq
  - tmux
  - python3-pip


# Locales to generate — first entry becomes the system default
common_locales:
  - en_US.UTF-8
  - de_DE.UTF-8
common_locale: en_US.UTF-8
