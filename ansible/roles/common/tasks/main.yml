---
# roles/common/tasks/main.yml — True base: apt cache, base packages, shell, ~/.local/bin
# No dependencies. All other roles depend on this (directly or transitively).

- name: Install locales package
  ansible.builtin.apt:
    name: locales
    state: present
    update_cache: true
  become: true
  tags: packages

- name: Generate locales
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop: "{{ common_locales }}"
  become: true
  tags: packages

- name: Set system locale
  ansible.builtin.command: update-locale LANG={{ common_locale }} LC_ALL={{ common_locale }}
  become: true
  changed_when: false
  tags: packages

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: packages

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  become: true
  tags: packages

- name: Ensure ~/.local/bin exists (owned by user)
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: "0755"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
  become: true
  tags: packages
