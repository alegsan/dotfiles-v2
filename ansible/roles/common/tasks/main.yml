---
# roles/common/tasks/main.yml — Base packages + zsh setup

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: packages

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  become: true
  tags: packages

- name: Install profile-specific packages
  ansible.builtin.apt:
    name: "{{ profile_packages | default([]) }}"
    state: present
  become: true
  tags: packages
  when: profile_packages is defined and profile_packages | length > 0

- name: Remove apt ansible-lint (incompatible with PPA ansible)
  ansible.builtin.apt:
    name: ansible-lint
    state: absent
  become: true
  tags: packages

- name: Install ansible-lint via pip
  ansible.builtin.pip:
    name: ansible-lint
    state: present
    extra_args: --break-system-packages
  become: false
  tags: packages

- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
  become: true
  tags: packages

- name: Ensure ~/.local/bin exists (owned by user)
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: "0755"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
  become: true
  tags: packages
