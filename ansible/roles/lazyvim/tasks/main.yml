---
# roles/lazyvim/tasks/main.yml
# Installs neovim nightly via asdf + LazyVim config (via Homebrew/asdf).
# Depends on: brew (listed before this role in playbook).
# NOTE: become: false on all user-level tasks — asdf/neovim must install into user home.

- name: Install neovim brew packages
  community.general.homebrew:
    name: "{{ lazyvim_brew_packages }}"
    state: present
    path: "{{ brew_prefix }}/bin"
  become: false
  environment:
    PATH: "{{ brew_prefix }}/bin:{{ ansible_env.PATH }}"
  tags: lazyvim

- name: Install neovim brew casks (fonts)
  community.general.homebrew_cask:
    name: "{{ lazyvim_brew_casks }}"
    state: present
    path: "{{ brew_prefix }}/bin"
  become: false
  environment:
    PATH: "{{ brew_prefix }}/bin:{{ ansible_env.PATH }}"
  failed_when: false
  tags: lazyvim

- name: Install neovim apt dependencies
  ansible.builtin.apt:
    name: "{{ lazyvim_apt_packages }}"
    state: present
  become: true
  tags: lazyvim

- name: Remove apt neovim (neovim managed via asdf nightly)
  ansible.builtin.apt:
    name: neovim
    state: absent
  become: true
  tags: lazyvim

- name: Add asdf neovim plugin
  ansible.builtin.command: "{{ asdf_bin }} plugin add neovim https://github.com/richin13/asdf-neovim"
  environment:
    PATH: "{{ brew_prefix }}/bin:{{ ansible_env.PATH }}"
  register: lazyvim_asdf_plugin_add
  changed_when: "'already added' not in lazyvim_asdf_plugin_add.stderr"
  failed_when:
    - lazyvim_asdf_plugin_add.rc != 0
    - "'already added' not in lazyvim_asdf_plugin_add.stderr"
  become: false
  tags: lazyvim

- name: Check if neovim nightly already installed via asdf
  ansible.builtin.shell: |
    eval "$({{ brew_prefix }}/bin/brew shellenv)"
    asdf where neovim
  register: lazyvim_asdf_nvim_where
  failed_when: false
  changed_when: false
  become: false
  tags: lazyvim

- name: Install neovim nightly via asdf
  ansible.builtin.shell: |
    eval "$({{ brew_prefix }}/bin/brew shellenv)"
    asdf install neovim nightly
  when: lazyvim_asdf_nvim_where.rc != 0
  changed_when: false
  become: false
  tags: lazyvim

- name: Set neovim nightly as global default
  ansible.builtin.shell: |
    eval "$({{ brew_prefix }}/bin/brew shellenv)"
    asdf set -u neovim nightly
  when: lazyvim_asdf_nvim_where.rc != 0
  changed_when: false
  become: false
  tags: lazyvim

- name: Symlink nvim to ~/.local/bin
  ansible.builtin.shell: |
    eval "$({{ brew_prefix }}/bin/brew shellenv)"
    NVIM_PATH=$(asdf where neovim)/bin/nvim
    ln -sf "$NVIM_PATH" {{ lazyvim_bin_dir }}/nvim
  changed_when: false
  become: false
  tags: lazyvim

- name: Ensure ~/.local/bin is in PATH via ~/.profile
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.profile"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    create: true
    mode: "0644"
  become: false
  tags: lazyvim

- name: Install luarocks tiktoken_core (for codecompanion)
  ansible.builtin.shell: |
    eval "$({{ brew_prefix }}/bin/brew shellenv)"
    luarocks install --lua-version 5.1 --local tiktoken_core
  args:
    creates: "{{ lookup('env', 'HOME') }}/.luarocks/lib/luarocks/rocks-5.1/tiktoken_core"
  become: false
  tags: lazyvim

- name: Install neovim npm package (node provider) via brew node
  ansible.builtin.shell: |
    eval "$({{ brew_prefix }}/bin/brew shellenv)"
    npm install -g neovim
  changed_when: false
  become: false
  tags: lazyvim

- name: Ensure ~/.config/nvim subdirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ lookup('env', 'HOME') }}/.config/nvim"
    - "{{ lookup('env', 'HOME') }}/.config/nvim/lua/config"
    - "{{ lookup('env', 'HOME') }}/.config/nvim/lua/plugins"
  become: false
  tags: lazyvim

- name: Symlink nvim config files from dotfiles repo
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ lazyvim_config_symlinks }}"
  become: false
  tags: lazyvim

- name: Symlink nvim prompt/review dirs from dotfiles repo
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ lazyvim_dir_symlinks }}"
  become: false
  tags: lazyvim

- name: Register nvim as vim via update-alternatives
  ansible.builtin.command: >-
    update-alternatives --install /usr/bin/vim vim {{ lazyvim_bin_dir }}/nvim 100
  become: true
  changed_when: false
  tags: lazyvim

- name: Set nvim as default vim alternative
  ansible.builtin.command: update-alternatives --set vim {{ lazyvim_bin_dir }}/nvim
  become: true
  changed_when: false
  tags: lazyvim

- name: Bootstrap LazyVim (headless install)
  ansible.builtin.shell: |
    eval "$({{ brew_prefix }}/bin/brew shellenv)"
    {{ lazyvim_bin_dir }}/nvim --headless '+Lazy! sync' +qa
  environment:
    PATH: "{{ lazyvim_bin_dir }}:{{ brew_prefix }}/bin:{{ ansible_env.PATH }}"
  changed_when: false
  become: false
  tags: lazyvim
