---
# asdf binary (provided by brew)
asdf_bin: "{{ brew_prefix }}/bin/asdf"

# Where to symlink nvim binary
lazyvim_bin_dir: "{{ lookup('env', 'HOME') }}/.local/bin"

# Brew packages this role needs
lazyvim_brew_packages:
  - asdf
  - rust
  - node
  - lazygit

# Brew casks this role needs
lazyvim_brew_casks:
  - font-ubuntu-sans-nerd-font

# Apt packages required by neovim and its plugins
lazyvim_apt_packages:
  - build-essential
  - luarocks
  - pkg-config
  - ripgrep
  - fd-find
  - python3-pynvim
  - xclip

# Individual files to symlink from dotfiles repo into ~/.config/nvim
# Directories are created automatically; files are symlinked.
lazyvim_config_symlinks:
  - src: "{{ dotfiles_dir }}/config/nvim/init.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/init.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/stylua.toml"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/stylua.toml"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/config/autocmds.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/config/autocmds.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/config/keymaps.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/config/keymaps.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/config/lazy.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/config/lazy.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/config/options.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/config/options.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/plugins/codecompanion.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/plugins/codecompanion.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/plugins/colorizer.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/plugins/colorizer.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/plugins/colorscheme.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/plugins/colorscheme.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/plugins/conform.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/plugins/conform.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/plugins/lsp.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/plugins/lsp.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/plugins/mason.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/plugins/mason.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/plugins/nvim-lint.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/plugins/nvim-lint.lua"
  - src: "{{ dotfiles_dir }}/config/nvim/lua/plugins/snacks.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/plugins/snacks.lua"

# Directories to symlink wholesale (prompts, reviews — read-only by nvim)
lazyvim_dir_symlinks:
  - src: "{{ dotfiles_dir }}/config/nvim/prompts"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/prompts"
  - src: "{{ dotfiles_dir }}/config/nvim/reviews"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/reviews"
